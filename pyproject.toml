[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "did-estimator-comparisons"
version = "0.2.0"
description = "Anonymized saved-estimate replication for TWFE, CSA, and BJS figures"
requires-python = ">=3.12"
dependencies = ["numpy==2.3.5", "pandas==3.0.1", "matplotlib==3.11.2"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
